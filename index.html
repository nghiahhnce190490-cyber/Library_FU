<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8" />
<title>Quản lý thư viện</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>
  <header>
    <h1>Thư viện — Checkin/Checkout</h1>
    <nav>
      <button class="tab-btn active" data-tab="search">Tìm & mượn sách</button>
      <button class="tab-btn" data-tab="return">Trả sách</button>
      <button class="tab-btn" data-tab="admin">Quản lý (thủ thư)</button>
    </nav>
  </header>

  <main>
    <!-- TAB: TÌM & MƯỢN SÁCH -->
    <section id="tab-search" class="tab-panel active">
      <div class="filters">
        <input type="text" id="searchInput" placeholder="Tìm theo tên sách hoặc tác giả..." />
        <input type="text" id="subjectInput" placeholder="Mã môn (vd: TOAN101)" />
        <button onclick="loadBooks()">Tìm kiếm</button>
      </div>

      <div class="member-select">
        <label>Chọn tài khoản (mã học sinh):</label>
        <select id="memberSelect"></select>
      </div>

      <div id="bookList" class="card-list"></div>
    </section>

    <!-- TAB: TRẢ SÁCH -->
    <section id="tab-return" class="tab-panel">
      <h2>Danh sách đang mượn / quá hạn</h2>
      <div id="loanList" class="card-list"></div>
    </section>

    <!-- TAB: QUẢN LÝ -->
    <section id="tab-admin" class="tab-panel">
      <h2>Thêm sách mới</h2>
      <form id="addBookForm" class="form-grid">
        <input name="title" placeholder="Tên sách" required />
        <input name="author" placeholder="Tác giả" />
        <input name="subject_code" placeholder="Mã môn" />
        <input name="book_link" placeholder="Link sách (URL)" />
        <input name="shelf_location" placeholder="Vị trí kệ (vd: Kệ A1 - Tầng 1)" />
        <input name="total_qty" type="number" min="1" value="1" placeholder="Số lượng" required />
        <button type="submit">Thêm sách</button>
      </form>

      <h2>Thêm thành viên (tạm thời, chờ đồng bộ API trường)</h2>
      <form id="addMemberForm" class="form-grid">
        <input name="student_code" placeholder="Mã học sinh" required />
        <input name="name" placeholder="Họ tên" required />
        <input name="class_name" placeholder="Lớp/Khoa" />
        <input name="contact" placeholder="Liên hệ (email/SĐT)" />
        <button type="submit">Thêm thành viên</button>
      </form>

      <h2>Toàn bộ phiếu mượn</h2>
      <div id="allLoanList" class="card-list"></div>
    </section>
  </main>

  <div id="toast"></div>

  <script src="app.js"></script>
</body>
</html>
